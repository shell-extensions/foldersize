name: Build file manager extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip python3-gi python3-nautilus python3-caja nemo-python

      - name: Build translations
        run: make

      - name: Check imports
        run: make check

      - name: Pack extension
        id: pack
        run: |
          make pack
          echo "zip_name=foldersize.file-manager-extension.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip_name }}
          path: dist/${{ steps.pack.outputs.zip_name }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.pack.outputs.zip_name }}
